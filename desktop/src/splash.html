<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
  <title>NUMIQ</title>
  <style>
    :root { --bg: #f5f6f8; --card: #ffffff; --text: #11141b; --muted: #6b7280; --brand: #4f46e5; --line: #e5e7ec; --err: #b42318; --err-bg: #fef3f2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0a0c10; --card: #12151c; --text: #eef0f4; --muted: #8b93a3; --brand: #8b84ff; --line: #232834; --err: #fda29b; --err-bg: #2a1614; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
      -webkit-app-region: drag; user-select: none;
    }
    .box { width: 100%; padding: 32px; text-align: center; }
    .logo { display: block; width: 60px; height: 60px; margin: 0 auto 18px; border-radius: 17px; box-shadow: 0 12px 30px -12px #4f46e5; }
    h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    p { margin: 6px 0 0; color: var(--muted); min-height: 20px; }
    .bar { position: relative; height: 3px; margin: 22px auto 0; width: 160px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: var(--brand); animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    .err { display: none; margin-top: 18px; padding: 12px 14px; border-radius: 10px; background: var(--err-bg); color: var(--err); text-align: left; font-size: 13px; white-space: pre-wrap; word-break: break-word; -webkit-app-region: no-drag; user-select: text; }
    body.failed .bar { display: none; }
    body.failed .err { display: block; }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div class="box">
    <svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7464ff"/><stop offset="1" stop-color="#3a2fd6"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#g)"/><path d="M10 23V10.2l12 12.6V14.2" fill="none" stroke="#fff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="9.4" r="2.4" fill="#67e8f9"/></svg>
    <h1>NUMIQ</h1>
    <p id="status">Arrancando…</p>
    <div class="bar" role="progressbar" aria-label="Cargando"></div>
    <div id="err" class="err" role="alert"></div>
  </div>
  <script>
    // La app cambia el texto con executeJavaScript: setStatus('…') y fail('…')
    window.setStatus = (t) => { document.getElementById('status').textContent = t }
    window.fail = (t) => { document.body.classList.add('failed'); document.getElementById('status').textContent = 'No se pudo abrir NUMIQ'; document.getElementById('err').textContent = t }
  </script>
</body>
</html>
